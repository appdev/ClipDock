[package]
name = "clipboard_core"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1"
clipdock_asset_store = { path = "../../../../shared/rust/clipdock_asset_store" }
rusqlite = { version = "0.39", features = ["bundled", "blob"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-simple-tokenizer = { path = "../../vendor/sqlite-simple-tokenizer" }
unicode-segmentation = "1.12"
scraper = "0.24"
url = "2"

tempfile = "3.21"
